<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chatly - Chatroom Test</title>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #0d1117; 
            color: #c9d1d9; 
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Login Panel */
        #loginPanel {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #1a1f2e 0%, #0d1117 100%);
        }
        .login-box {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 32px;
            width: 420px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }
        .login-box h1 {
            color: #58a6ff;
            margin-bottom: 24px;
            text-align: center;
            font-size: 28px;
        }
        .login-box label {
            display: block;
            color: #8b949e;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .login-box input {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 16px;
            background: #010409;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #c9d1d9;
            font-size: 14px;
            font-family: monospace;
        }
        .login-box input:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .login-box button {
            width: 100%;
            padding: 12px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .login-box button:hover {
            background: #2ea043;
        }
        .login-box #conversationNote {
            color: #8b949e;
            text-align: center;
            font-size: 14px;
            margin-top: 8px;
            margin-bottom: 16px;
        }
        .login-box .error {
            color: #f85149;
            font-size: 13px;
            margin-top: 12px;
            text-align: center;
        }

        /* Chat Panel */
        #chatPanel {
            display: none;
            height: 100vh;
            flex-direction: column;
        }

        /* Header */
        .chat-header {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .chat-header h2 {
            color: #58a6ff;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #3fb950;
            display: inline-block;
        }
        .chat-header button {
            padding: 8px 16px;
            background: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: background 0.2s;
        }
        .chat-header button:hover {
            background: #30363d;
        }

        /* Messages Container */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #0d1117;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .messages-container::-webkit-scrollbar {
            width: 8px;
        }
        .messages-container::-webkit-scrollbar-track {
            background: #161b22;
        }
        .messages-container::-webkit-scrollbar-thumb {
            background: #30363d;
            border-radius: 4px;
        }

        /* Message Bubble */
        .message {
            display: flex;
            flex-direction: column;
            max-width: 70%;
            animation: slideIn 0.2s ease-out;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .message.sent {
            align-self: flex-end;
        }
        .message.received {
            align-self: flex-start;
        }
        .message-bubble {
            padding: 10px 14px;
            border-radius: 12px;
            word-wrap: break-word;
            position: relative;
        }
        .message.sent .message-bubble {
            background: #1f6feb;
            color: white;
            border-bottom-right-radius: 4px;
        }
        .message.received .message-bubble {
            background: #21262d;
            color: #c9d1d9;
            border-bottom-left-radius: 4px;
        }
        .message-info {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 4px;
            font-size: 11px;
            color: #8b949e;
        }
        .message.sent .message-info {
            justify-content: flex-end;
        }
        .message-status {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .message-status svg {
            width: 14px;
            height: 14px;
        }
        .status-sent { color: #8b949e; }
        .status-delivered { color: #58a6ff; }
        .status-seen { color: #3fb950; }

        /* Typing Indicator */
        .typing-indicator {
            display: none;
            padding: 10px 14px;
            background: #21262d;
            border-radius: 12px;
            width: fit-content;
            margin-left: 0;
        }
        .typing-indicator.active {
            display: block;
            animation: slideIn 0.2s ease-out;
        }
        .typing-dots {
            display: flex;
            gap: 4px;
        }
        .typing-dots span {
            width: 8px;
            height: 8px;
            background: #8b949e;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.7; }
            30% { transform: translateY(-10px); opacity: 1; }
        }

        /* Input Area */
        .input-area {
            background: #161b22;
            border-top: 1px solid #30363d;
            padding: 16px 20px;
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        .input-wrapper {
            flex: 1;
            position: relative;
        }
        .input-area textarea {
            width: 100%;
            padding: 10px 14px;
            background: #010409;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #c9d1d9;
            font-size: 14px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            resize: none;
            max-height: 120px;
            min-height: 44px;
        }
        .input-area textarea:focus {
            outline: none;
            border-color: #58a6ff;
        }
        .input-area button {
            padding: 10px 20px;
            background: #238636;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            height: 44px;
            transition: background 0.2s;
        }
        .input-area button:hover:not(:disabled) {
            background: #2ea043;
        }
        .input-area button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* System Message */
        .system-message {
            text-align: center;
            color: #8b949e;
            font-size: 12px;
            padding: 8px;
            margin: 8px 0;
        }

        /* Utilities */
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Login Panel -->
    <div id="loginPanel">
        <div class="login-box">
            <h1>💬 Chatly Chatroom</h1>
            <label>JWT Token</label>
            <input type="text" id="tokenInput" placeholder="Paste your JWT token here">
            
            <label>Conversation ID</label>
            <input type="text" id="conversationInput" placeholder="Enter conversation ID">
            
            <button onclick="connectToChat()">Join Chat</button>
            <small id="conversationNote">(Create Conversation Room -> /api/conversations)</small>
            <div id="loginError" class="error"></div>
        </div>
    </div>

    <!-- Chat Panel -->
    <div id="chatPanel">
        <div class="chat-header">
            <h2>
                <span class="status-dot"></span>
                <span>Conversation: <span id="currentConvId"></span></span>
            </h2>
            <button onclick="disconnect()">Disconnect</button>
        </div>

        <div class="messages-container" id="messagesContainer">
            <div class="system-message">Connected to chatroom. Start messaging!</div>
            <div class="typing-indicator" id="typingIndicator">
                <div class="typing-dots">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea 
                    id="messageInput" 
                    placeholder="Type a message..." 
                    rows="1"
                    onkeydown="handleKeyDown(event)"
                    oninput="handleTyping()"></textarea>
            </div>
            <button onclick="sendMessage()" id="sendBtn">Send</button>
        </div>
    </div>

    <script>
        var stompClient = null;
        var subscription = null;
        var typingSubscription = null;
        var conversationId = null;
        var currentUserId = null;
        var typingTimeout = null;
        var isTyping = false;

        // Auto-resize textarea
        const messageInput = document.getElementById('messageInput');
        if (messageInput) {
            messageInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });
        }

        function showError(msg) {
            document.getElementById('loginError').textContent = msg;
        }

        function connectToChat() {
            const token = document.getElementById('tokenInput').value.trim();
            const convId = document.getElementById('conversationInput').value.trim();

            if (!token) {
                showError('⚠️ Please enter JWT token');
                return;
            }
            if (!convId) {
                showError('⚠️ Please enter conversation ID');
                return;
            }

            showError('Connecting...');
            conversationId = convId;

            // Parse JWT to get user ID (basic decode)
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                currentUserId = payload.sub || payload.userId || payload.id;
            } catch(e) {
                console.warn('Could not parse user ID from token');
            }

            // Connect via SockJS
            const socket = new SockJS('http://localhost:8080/ws?token=' + token);
            stompClient = Stomp.over(socket);
            stompClient.debug = null; // suppress logs

            stompClient.connect({}, function(frame) {
                // Successfully connected
                document.getElementById('loginPanel').style.display = 'none';
                document.getElementById('chatPanel').style.display = 'flex';
                document.getElementById('currentConvId').textContent = conversationId;

                // Subscribe to messages
                subscription = stompClient.subscribe('/topic/conversation.' + conversationId, function(message) {
                    const msg = JSON.parse(message.body);
                    displayMessage(msg);
                    
                    // Auto-send seen for received messages
                    if (msg.senderId !== currentUserId && msg.id) {
                        setTimeout(() => sendSeen(msg.id), 500);
                    }
                });

                // Subscribe to typing indicator
                typingSubscription = stompClient.subscribe('/topic/conversation.' + conversationId + '.typing', function(message) {
                    const data = JSON.parse(message.body);
                    if (data.userId !== currentUserId) {
                        showTypingIndicator(data.typing);
                    }
                });

                addSystemMessage('✅ Connected successfully');
            }, function(error) {
                showError('❌ Connection failed: ' + error);
                console.error('STOMP error:', error);
            });

            socket.onclose = function(e) {
                addSystemMessage('❌ Connection closed');
                setTimeout(() => {
                    document.getElementById('chatPanel').style.display = 'none';
                    document.getElementById('loginPanel').style.display = 'flex';
                    showError('Connection closed. Please reconnect.');
                }, 1000);
            };
        }

        function disconnect() {
            if (stompClient) {
                stompClient.disconnect(function() {
                    document.getElementById('chatPanel').style.display = 'none';
                    document.getElementById('loginPanel').style.display = 'flex';
                    showError('');
                });
                stompClient = null;
                subscription = null;
                typingSubscription = null;
            }
        }

        function sendMessage() {
            if (!stompClient || !stompClient.connected) {
                alert('Not connected');
                return;
            }

            const content = document.getElementById('messageInput').value.trim();
            if (!content) return;

            const payload = {
                conversationId: conversationId,
                content: content,
                messageType: 'TEXT'
            };

            stompClient.send('/app/chat.send', {}, JSON.stringify(payload));
            
            // Clear input
            document.getElementById('messageInput').value = '';
            document.getElementById('messageInput').style.height = 'auto';

            // Stop typing indicator
            if (isTyping) {
                sendTypingStatus(false);
                isTyping = false;
            }
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function handleTyping() {
            if (!stompClient || !stompClient.connected) return;

            // Send typing=true if not already typing
            if (!isTyping) {
                sendTypingStatus(true);
                isTyping = true;
            }

            // Reset timeout
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                sendTypingStatus(false);
                isTyping = false;
            }, 2000);
        }

        function sendTypingStatus(typing) {
            if (!stompClient || !stompClient.connected) return;
            
            const payload = {
                conversationId: conversationId,
                typing: typing
            };
            stompClient.send('/app/chat.typing', {}, JSON.stringify(payload));
        }

        function sendSeen(messageId) {
            if (!stompClient || !stompClient.connected) return;
            
            const payload = { messageId: messageId };
            stompClient.send('/app/chat.seen', {}, JSON.stringify(payload));
        }

        function displayMessage(msg) {
            const container = document.getElementById('messagesContainer');
            const typingIndicator = document.getElementById('typingIndicator');
            
            // Check if message already exists (avoid duplicates)
            if (msg.id && document.getElementById('msg-' + msg.id)) {
                return;
            }

            const messageDiv = document.createElement('div');
            messageDiv.className = 'message ' + (msg.senderId === currentUserId ? 'sent' : 'received');
            if (msg.id) {
                messageDiv.id = 'msg-' + msg.id;
            }

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = msg.content;

            const info = document.createElement('div');
            info.className = 'message-info';

            // Time
            const time = document.createElement('span');
            const msgDate = msg.createdAt ? new Date(msg.createdAt) : new Date();
            time.textContent = msgDate.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            info.appendChild(time);

            // Status (only for sent messages)
            if (msg.senderId === currentUserId) {
                const status = document.createElement('span');
                status.className = 'message-status';
                status.innerHTML = getStatusIcon(msg.status || 'SENT');
                info.appendChild(status);
            }

            messageDiv.appendChild(bubble);
            messageDiv.appendChild(info);

            // Insert before typing indicator
            container.insertBefore(messageDiv, typingIndicator);
            
            // Scroll to bottom
            container.scrollTop = container.scrollHeight;
        }

        function getStatusIcon(status) {
            const icons = {
                'SENT': '<svg class="status-sent" fill="currentColor" viewBox="0 0 16 16"><path d="M13.854 3.646a.5.5 0 0 1 0 .708l-7 7a.5.5 0 0 1-.708 0l-3.5-3.5a.5.5 0 1 1 .708-.708L6.5 10.293l6.646-6.647a.5.5 0 0 1 .708 0z"/></svg>',
                'DELIVERED': '<svg class="status-delivered" fill="currentColor" viewBox="0 0 16 16"><path d="M12.354 4.354a.5.5 0 0 0-.708-.708L5 10.293 1.854 7.146a.5.5 0 1 0-.708.708l3.5 3.5a.5.5 0 0 0 .708 0l7-7zm-4.208 7-.896-.897.707-.707.543.543 6.646-6.647a.5.5 0 0 1 .708.708l-7 7a.5.5 0 0 1-.708 0z"/><path d="m5.354 7.146.896.897-.707.707-.897-.896a.5.5 0 1 1 .708-.708z"/></svg>',
                'SEEN': '<svg class="status-seen" fill="currentColor" viewBox="0 0 16 16"><path d="M12.354 4.354a.5.5 0 0 0-.708-.708L5 10.293 1.854 7.146a.5.5 0 1 0-.708.708l3.5 3.5a.5.5 0 0 0 .708 0l7-7zm-4.208 7-.896-.897.707-.707.543.543 6.646-6.647a.5.5 0 0 1 .708.708l-7 7a.5.5 0 0 1-.708 0z"/><path d="m5.354 7.146.896.897-.707.707-.897-.896a.5.5 0 1 1 .708-.708z"/></svg>'
            };
            return icons[status] || icons['SENT'];
        }

        function showTypingIndicator(show) {
            const indicator = document.getElementById('typingIndicator');
            const container = document.getElementById('messagesContainer');
            
            if (show) {
                indicator.classList.add('active');
                container.scrollTop = container.scrollHeight;
            } else {
                indicator.classList.remove('active');
            }
        }

        function addSystemMessage(text) {
            const container = document.getElementById('messagesContainer');
            const typingIndicator = document.getElementById('typingIndicator');
            const msg = document.createElement('div');
            msg.className = 'system-message';
            msg.textContent = text;
            container.insertBefore(msg, typingIndicator);
            container.scrollTop = container.scrollHeight;
        }

        // Allow Enter to submit on login
        document.getElementById('conversationInput')?.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') connectToChat();
        });
    </script>

</body>
</html>
