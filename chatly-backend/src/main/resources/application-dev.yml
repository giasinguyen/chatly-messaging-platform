spring:
    application:
        name: chatly-backend

    datasource:
        url: jdbc:postgresql://localhost:5432/chatly
        username: chatly
        password: chatly123
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: update
        defer-datasource-initialization: true
        open-in-view: false
        properties:
            hibernate:
                dialect: org.hibernate.dialect.PostgreSQLDialect

    sql:
        init:
            mode: never # chịu khó gọi Postman 'register / create' data sample đi seed lag vc:v
            data-locations: classpath:db/seed-data.sql

    data:
        redis:
            host: localhost
            port: 6379
    mongodb:
        uri: mongodb://localhost:27017/chatly

    servlet:
        multipart:
            enabled: true
            max-file-size: 20MB
            max-request-size: 25MB

server:
    port: 8080

logging:
    level:
        root: INFO
        com.chatly: DEBUG
        # Spring WebSocket/Messaging framework internals — DEBUG floods logs with
        # every STOMP heartbeat/frame; keep at WARN in dev to avoid drowning traces
        org.springframework.web.socket: WARN
        org.springframework.messaging: WARN
        org.springframework.security: WARN
        org.hibernate.SQL: WARN

app:
    jwt:
        secret: Y2hhdGx5LXNlY3JldC1rZXktZm9yLWp3dC10b2tlbi1nZW5lcmF0aW9uLTIwMjY=
        expiration-ms: 86400000 # 1d
        refresh-expiration-ms: 86400000 # 1d
    cors:
        allowed-origins: http://localhost:3000, http://localhost:5174

# ── File Storage ──────────────────────────────────────────────────────────────
storage:
    provider: local          # switch to "s3" when ready for cloud
    max-file-size-mb: 20
    local:
        upload-dir: ./uploads
        base-url: http://localhost:8080/uploads
    # S3 settings (fill in when switching to s3 provider)
    s3:
        bucket: ""
        region: ""
        access-key: ""
        secret-key: ""
