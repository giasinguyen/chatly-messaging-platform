<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Verification</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #111827;">
<div style="max-width: 560px; margin: 0 auto; padding: 24px;">
    <h2 style="margin-bottom: 12px;">Verify your Chatly account</h2>
    <p style="margin-bottom: 16px;">Hi <strong th:text="${displayName}">User</strong>,</p>
    <p style="margin-bottom: 16px;">Click the button below to verify your email address:</p>
    <a th:href="${verificationLink}"
       style="display: inline-block; background: #2563eb; color: #ffffff; padding: 10px 18px; border-radius: 8px; text-decoration: none; font-weight: 700;">
        Verify email
    </a>
    <p style="margin: 16px 0;">
        If the button does not work, use this link:
        <a th:href="${verificationLink}" th:text="${verificationLink}">Verification link</a>
    </p>
    <p style="margin-bottom: 16px;">This verification link will expire in <strong th:text="${expiresInMinutes}">15</strong> minutes.</p>
    <p style="color: #6b7280; font-size: 14px;">If you did not request this, please ignore this email.</p>
</div>
</body>
</html>
