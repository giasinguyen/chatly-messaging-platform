<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New password</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #111827;">
<div style="max-width: 560px; margin: 0 auto; padding: 24px;">
    <h2 style="margin-bottom: 12px;">Your Chatly password has been reset</h2>
    <p style="margin-bottom: 16px;">Hi <strong th:text="${displayName}">User</strong>,</p>
    <p style="margin-bottom: 16px;">Here is your new temporary password (copy from the box — do not retype):</p>
    <pre style="font-size: 20px; letter-spacing: 0.5px; font-weight: 700; margin: 16px 0; padding: 12px 16px; background: #f3f4f6; border-radius: 8px; color: #111827; font-family: ui-monospace, Consolas, monospace; white-space: pre; overflow-x: auto;"
         th:text="${newPassword}">TempPassword123</pre>
    <p style="margin-bottom: 12px;">Please log in and change your password immediately for security.</p>
    <p style="color: #6b7280; font-size: 14px;">If you did not request this, contact support right away.</p>
</div>
</body>
</html>
